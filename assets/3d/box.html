<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVO Box 3D</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    background:rgba(255,255,255,.88);color:#2535a8;font-size:13px;font-weight:600;
    padding:9px 18px;border-radius:30px;box-shadow:0 2px 10px rgba(0,0,0,.12);
    pointer-events:none;transition:opacity .3s;white-space:nowrap}
  #btn{position:fixed;right:16px;top:14px;border:0;cursor:pointer;color:#fff;font-weight:700;
    font-size:13px;padding:10px 22px;border-radius:30px;
    background:linear-gradient(#0055d0,#4a98ff);box-shadow:0 2px 10px rgba(0,0,0,.18)}
  #btn:disabled{opacity:.55;cursor:default}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#2535a8;font-weight:600;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="load">Loading 3D…</div>
<div id="hint">Click the QC sticker to open the box</div>
<button id="btn">Open box</button>

<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';

/* ───────────────────────── Product config ─────────────────────────
   لإضافة منتج جديد: حط صوره في textures/<id>/ بنفس الأسماء وضيف سطر هنا
   (front/back/left/right/top/pouch_front/pouch_back .jpg) */
const PRODUCTS = {
  hpylori_ag: { dir: 'textures/hpylori_ag/', L: 4.35, W: 3.2, H: 2.0, flap: 0.12, stickerX: 0.0 },
  ctni:       { dir: 'textures/ctni/',       L: 4.35, W: 3.2, H: 2.0, flap: 0.12, stickerX: 0.0 },
};
const key = new URLSearchParams(location.search).get('p') || 'hpylori_ag';
if (key === 'evo_plus') {
  window.location.replace('evo_plus.html' + window.location.search);
}
const cfg = PRODUCTS[key] || PRODUCTS.hpylori_ag;
const { L, W, H } = cfg;
const T = 0.04;                 // سمك الكرتون
const FH = H * cfg.flap;        // ارتفاع اللسان الأمامي للغطا

/* ───────────────────────── Renderer / scene ───────────────────────── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(0, 5.0, 11.8);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.53;

scene.add(new THREE.HemisphereLight(0xffffff, 0xaebbd0, 1.35));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2.5, 8, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 35 });
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ───────────────────────── Textures / materials ───────────────────────── */
const manager = new THREE.LoadingManager(
  () => {
    const l = document.getElementById('load');
    if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 500); }
  },
  undefined,
  (url) => {
    console.warn('Failed loading texture:', url);
    const l = document.getElementById('load');
    if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 500); }
  }
);
const loader = new THREE.TextureLoader(manager);
const aniso = renderer.capabilities.getMaxAnisotropy();
function tex(name) {
  const t = loader.load(cfg.dir + name);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  return t;
}
const std = (o) => new THREE.MeshStandardMaterial({ roughness: 0.6, metalness: 0, ...o });
const cream = std({ color: 0xf1e9db, roughness: 0.9 });
const kraft = std({ color: 0xb79b78, roughness: 0.95 });

/* صندوق بسمك: الوش الخارجي (outIdx) بتكستشر، والباقي كرتون */
function slab(w, h, d, outIdx, map) {
  const mats = Array(6).fill(cream);
  if (map) mats[outIdx] = std({ map, roughness: 0.5 });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
  m.castShadow = m.receiveShadow = true;
  return m;
}

/* ───────────────────────── Box body ───────────────────────── */
const box = new THREE.Group();
scene.add(box);

// الوش الأمامي (أحمر + QC): الجزء السفلي من الصورة، واللسان بياخد الجزء العلوي
const frontBodyH = H - FH;
const frontTexBody = tex('front.jpg');
frontTexBody.repeat.set(1, frontBodyH / H);
frontTexBody.offset.set(0, 0);
const frontTexFlap = tex('front.jpg');
frontTexFlap.repeat.set(1, FH / H);
frontTexFlap.offset.set(0, 1 - FH / H);

const front = slab(L - 2 * T, frontBodyH, T, 4, frontTexBody);
front.position.set(0, frontBodyH / 2, W / 2 - T / 2);
const back = slab(L - 2 * T, H, T, 5, tex('back.jpg'));
back.position.set(0, H / 2, -W / 2 + T / 2);
const right = slab(T, H, W, 0, tex('right.jpg'));          // +x : ليبل H.Pylori
right.position.set(L / 2 - T / 2, H / 2, 0);
const left = slab(T, H, W, 1, tex('left.jpg'));            // -x : بيانات المصنع
left.position.set(-L / 2 + T / 2, H / 2, 0);
const bottom = slab(L, T, W, 3, null);                      // كرتون ناعم للقاع
bottom.position.set(0, T / 2, 0);
box.add(front, back, right, left, bottom);

/* ───────────────────────── Lid (hinged at back-top edge) ───────────────────────── */
const lid = new THREE.Group();
lid.position.set(0, H, -W / 2);
box.add(lid);
const lidTop = slab(L, T, W, 2, tex('top.jpg'));
lidTop.position.set(0, T / 2, W / 2);
const flap = slab(L - 2 * T, FH, T, 4, frontTexFlap);
flap.position.set(0, -FH / 2, W - T / 2);
lid.add(lidTop, flap);

/* ───────────────────────── Contents ───────────────────────── */
const inner = new THREE.Group();
box.add(inner);

// حاجز الأمبولات (كرتون)
const trayW = 1.3;
const divX = -L / 2 + T + trayW;
const divider = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.3, W - 2 * T), kraft);
divider.position.set(divX, 0.65 + T, 0);
divider.castShadow = divider.receiveShadow = true;
inner.add(divider);

function makeVial() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.7, 20), std({ color: 0xf4f4f4, roughness: 0.3 }));
  body.position.y = 0.35;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.32, 20), std({ color: 0xc4161c, roughness: 0.4 }));
  cap.position.y = 0.86;
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.105, 0.24, 16), std({ color: 0xf2c4cb, roughness: 0.5 }));
  tip.position.y = 1.14;
  [body, cap, tip].forEach(m => { m.castShadow = true; g.add(m); });
  return g;
}
const vials = [];
const cols = [-1.82, -1.52, -1.22];
for (let c = 0; c < 3; c++) {
  const n = c === 1 ? 8 : 9;
  for (let r = 0; r < n; r++) {
    if (vials.length >= 25) break;
    const v = makeVial();
    const z = -1.42 + r * 0.355 + (c === 1 ? 0.18 : 0);
    v.position.set(cols[c], T, z);
    inner.add(v);
    vials.push(v);
  }
}
const heroVial = vials[8];                       // أقرب أمبولة للواجهة
const vialStart = heroVial.position.clone();

// كروت التيست (كدسة)
const PL = 2.8, PH = 1.55, PT = 0.05;            // طول/ارتفاع/سمك الكارت
const pouchMat = std({ color: 0xdde5ee, roughness: 0.35, metalness: 0.45 });
const heroX = 0.55;
const stackGeo = new THREE.BoxGeometry(PT, PH, PL);
for (let x = divX + 0.12; x < L / 2 - T - 0.05; x += 0.1) {
  if (Math.abs(x - heroX) < 0.06) continue;      // مكان الكارت اللي هيطلع
  const m = new THREE.Mesh(stackGeo, pouchMat);
  m.position.set(x, T + PH / 2, 0);
  m.castShadow = m.receiveShadow = true;
  inner.add(m);
}

// الكارت البطل
const pouchFront = tex('pouch_front.jpg'), pouchBack = tex('pouch_back.jpg');
const heroMats = [pouchMat, pouchMat, pouchMat, pouchMat,
  std({ map: pouchFront, roughness: 0.3, metalness: 0.1 }),
  std({ map: pouchBack, roughness: 0.3, metalness: 0.1 })];
const hero = new THREE.Mesh(new THREE.BoxGeometry(PL, PH, PT), heroMats);
hero.castShadow = true;
const heroPivot = new THREE.Group();
heroPivot.add(hero);
inner.add(heroPivot);
const heroStart = new THREE.Vector3(heroX, T + PH / 2, 0);
heroPivot.position.copy(heroStart);
heroPivot.rotation.y = Math.PI / 2;

/* ───────────────────────── QC sticker (واقعي: نصه على الغطا ونصه على الوش مع تقشير ثلاثي الأبعاد) ───────────────────────── */
function makeStickerTexture() {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.clearRect(0, 0, s, s);

  // قرص الاستيكر الشفاف/اللامع (Vinyl)
  const grad = g.createRadialGradient(s * 0.45, s * 0.38, 15, s / 2, s / 2, s / 2 - 8);
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
  grad.addColorStop(0.5, 'rgba(245, 248, 255, 0.75)');
  grad.addColorStop(0.95, 'rgba(225, 235, 250, 0.60)');
  grad.addColorStop(1, 'rgba(210, 225, 245, 0.35)');

  g.beginPath();
  g.arc(s / 2, s / 2, s / 2 - 10, 0, Math.PI * 2);
  g.fillStyle = grad;
  g.fill();

  // إطار فضي لامع
  g.lineWidth = 7;
  g.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  g.stroke();
  g.lineWidth = 2;
  g.strokeStyle = 'rgba(74, 152, 255, 0.65)';
  g.stroke();

  // نص QC PASS بالخط العريض الأسود المطابق للاستيكر الحقيقي
  g.fillStyle = '#111111';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = '900 160px "Arial Black", Impact, sans-serif';
  g.fillText('QC', s / 2, s / 2 - 68);
  g.font = '900 120px "Arial Black", Impact, sans-serif';
  g.fillText('PASS', s / 2, s / 2 + 82);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  return t;
}

const SD = 0.95, SEAM = 0.35;                      // قطر الاستيكر + نسبة اللي فوق خط الغطا
const frontH = SD * (1 - SEAM), topH = SD * SEAM;
const stickerX = cfg.stickerX * L;
const frontY = H - frontH / 2;
const stickerBaseZ = W / 2 + 0.012;

// مادة الاستيكر من الوجهين
const stickerTex = makeStickerTexture();
const stickerMat = new THREE.MeshStandardMaterial({
  map: stickerTex,
  transparent: true,
  roughness: 0.25,
  metalness: 0.1,
  side: THREE.DoubleSide,
  depthWrite: false,
});

// مجسم الوش الأمامي مقسم (16x32) علشان يتقشر وينثني واقعياً
const geomFront = new THREE.PlaneGeometry(SD, frontH, 16, 32);
const uvF = geomFront.attributes.uv;
for (let i = 0; i < uvF.count; i++) uvF.setY(i, uvF.getY(i) * (1 - SEAM));
const posF = geomFront.attributes.position;
const origPosF = Float32Array.from(posF.array);
const stickerFront = new THREE.Mesh(geomFront, stickerMat);
stickerFront.position.set(stickerX, frontY, stickerBaseZ);
box.add(stickerFront);

// مجسم الوش العلوي (على الغطا)
const geomTop = new THREE.PlaneGeometry(SD, topH, 16, 16);
const uvT = geomTop.attributes.uv;
for (let i = 0; i < uvT.count; i++) uvT.setY(i, (1 - SEAM) + uvT.getY(i) * SEAM);
const posT = geomTop.attributes.position;
const origPosT = Float32Array.from(posT.array);
const stickerTop = new THREE.Mesh(geomTop, stickerMat);
stickerTop.rotation.x = -Math.PI / 2;
stickerTop.position.set(stickerX, T + 0.012, W - topH / 2);
lid.add(stickerTop);

// حلقة توهج ناعمة لجذب الانتباه للاستيكر
const glowRingMat = new THREE.MeshBasicMaterial({ color: 0x4a98ff, transparent: true, opacity: 0.6, depthWrite: false });
const glowRing = new THREE.Mesh(new THREE.RingGeometry(SD / 2 + 0.02, SD / 2 + 0.08, 48), glowRingMat);
glowRing.position.set(stickerX, H, stickerBaseZ + 0.002);
box.add(glowRing);

/* ───────────────────────── Animation state ───────────────────────── */
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const seg = (p, a, b) => clamp01((p - a) / (b - a));
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const lerp = (a, b, t) => a + (b - a) * t;

let p = 0, targetP = 0;                           // 0 = مقفولة ، 1 = مفتوحة والكارت بره
let flipTarget = 0, flip = 0;
const DURATION = 4.8;                             // ثواني للفتح الكامل
const LID_OPEN = THREE.MathUtils.degToRad(112);

const heroLift = new THREE.Vector3(heroX, 3.1, 0);
const heroEnd = new THREE.Vector3(0.25, 4.1, 1.7);
const vialLift = new THREE.Vector3(vialStart.x, 3.0, vialStart.z);
const vialEnd = new THREE.Vector3(-2.15, 3.45, 2.0);

function applyState(time) {
  // ──────────────── 1) مرحلة تقشير الاستيكر أولاً ────────────────
  // s_peel: من 0 إلى 0.24 (تقشير فيزيائي كامل للاستيكر قبل لمس الغطا)
  const s_peel = ease(seg(p, 0.0, 0.24));
  // s_fly: من 0.22 إلى 0.32 (انفصال وطيران الاستيكر واختفاؤه)
  const s_fly = ease(seg(p, 0.22, 0.32));

  const idle = p === 0 && targetP === 0;
  glowRing.visible = idle;
  if (idle) {
    glowRingMat.opacity = 0.35 + 0.35 * Math.sin(time * 4);
    glowRing.scale.setScalar(1 + 0.04 * Math.sin(time * 4));
  }

  stickerFront.visible = stickerTop.visible = s_fly < 0.999;
  stickerMat.opacity = (1 - s_fly * s_fly);

  // انحناء وتقشير الجزء الأمامي
  const rCurl = 0.18; // نصف قطر لفة التقشير
  for (let i = 0; i < posF.count; i++) {
    const x0 = origPosF[i * 3];
    const y0 = origPosF[i * 3 + 1];
    // v: من 0 (أسفل الاستيكر) إلى 1 (خط الفاصل العلوي)
    const v = (y0 + frontH / 2) / frontH;
    // إضافة ميل جانبي طفيف ليعطي حركة واقعية لليد وهي بتشد
    const v_eff = v + (x0 / SD) * 0.12;
    const peelLevel = s_peel * 1.25;

    if (v_eff >= peelLevel) {
      posF.setXYZ(i, x0, y0, 0);
    } else {
      const d = (peelLevel - v_eff) * frontH;
      const theta = d / rCurl;
      let y, z;
      if (theta < Math.PI) {
        z = rCurl * (1 - Math.cos(theta));
        y = (peelLevel - (x0 / SD) * 0.12) * frontH - frontH / 2 - rCurl * Math.sin(theta);
      } else {
        const tail = d - Math.PI * rCurl;
        z = 2 * rCurl + tail * 0.3;
        y = (peelLevel - (x0 / SD) * 0.12) * frontH - frontH / 2 - tail * 0.9;
      }
      posF.setXYZ(i, x0, y, z);
    }
  }
  posF.needsUpdate = true;
  geomFront.computeVertexNormals();

  // تقشير الجزء العلوي على الغطا لما التقشير يوصل للفاصل
  const s_top_peel = ease(seg(p, 0.14, 0.25));
  for (let i = 0; i < posT.count; i++) {
    const x0 = origPosT[i * 3];
    const y0 = origPosT[i * 3 + 1];
    // في الجزء العلوي y0=-topH/2 عند الفاصل و +topH/2 لورا
    const v = (y0 + topH / 2) / topH; // 0 عند الفاصل، 1 لورا
    if (v <= s_top_peel) {
      const d = (s_top_peel - v) * topH;
      const z = Math.sin(d / 0.15) * 0.12;
      posT.setXYZ(i, x0, y0, z);
    } else {
      posT.setXYZ(i, x0, y0, 0);
    }
  }
  posT.needsUpdate = true;

  // طيران الاستيكر بعيداً بعد ما اتقشر تماماً
  if (s_fly > 0) {
    stickerFront.position.z = stickerBaseZ + s_fly * 0.8;
    stickerFront.position.y = frontY + s_fly * 0.45;
    stickerFront.rotation.set(-s_fly * 0.8, s_fly * 1.2, s_fly * 0.6);
    stickerTop.position.y = (T + 0.012) + s_fly * 0.45;
    stickerTop.rotation.set(-Math.PI / 2 - s_fly * 0.6, s_fly * 0.8, 0);
  } else {
    stickerFront.position.set(stickerX, frontY, stickerBaseZ);
    stickerFront.rotation.set(0, 0, 0);
    stickerTop.position.set(stickerX, T + 0.012, W - topH / 2);
    stickerTop.rotation.set(-Math.PI / 2, 0, 0);
  }

  // ──────────────── 2) فتح الغطا (يبدأ فقط بعد انفصال الاستيكر بالكامل) ────────────────
  const s_lid = ease(seg(p, 0.30, 0.64));
  lid.rotation.x = -s_lid * LID_OPEN;

  // ──────────────── 3) خروج الكارت والأمبولة ────────────────
  const lift = ease(seg(p, 0.62, 0.82));
  const move = ease(seg(p, 0.80, 1.0));
  const bob = move > 0.99 ? Math.sin(time * 1.6) * 0.06 : 0;

  heroPivot.position.lerpVectors(heroStart, heroLift, lift).lerp(heroEnd, move);
  heroPivot.position.y += bob;
  heroPivot.rotation.y = lerp(Math.PI / 2, 0, move) + flip;
  heroPivot.rotation.x = -0.1 * move;

  heroVial.position.lerpVectors(vialStart, vialLift, lift).lerp(vialEnd, move);
  heroVial.position.y += bob;
  heroVial.rotation.z = 0.35 * move;

  // الكاميرا: زووم ودوران مريح
  const open = ease(seg(p, 0.15, 0.85));
  controls.target.y = lerp(1.2, 2.5, open);
  const z = lerp(1.35, 1.0, open);
  if (Math.abs(camera.zoom - z) > 0.0005) { camera.zoom = z; camera.updateProjectionMatrix(); }
}

/* ───────────────────────── Interaction ───────────────────────── */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(ev, objs) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.intersectObjects(objs, true).length > 0;
}

const hint = document.getElementById('hint');
const btn = document.getElementById('btn');
function setOpen(open) {
  targetP = open ? 1 : 0;
  btn.disabled = true;
  hint.style.opacity = 0;
}
function updateUI() {
  if (btn.disabled && Math.abs(p - targetP) < 0.001) {
    btn.disabled = false;
    if (targetP === 1) {
      btn.textContent = 'Close box';
      hint.textContent = 'Click the card to flip it • Drag to rotate';
    } else {
      btn.textContent = 'Open box';
      hint.textContent = 'Click the QC sticker to open the box';
    }
    hint.style.opacity = 1;
  }
}
btn.addEventListener('click', () => setOpen(targetP === 0));

let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  down = null;
  if (moved > 6) return;                          // ده كان سحب مش ضغطة
  if (targetP === 0 && p === 0 && pick(e, [stickerFront, stickerTop, glowRing])) setOpen(true);
  else if (targetP === 1 && p === 1 && pick(e, [hero])) flipTarget += Math.PI;
});
canvas.addEventListener('pointermove', (e) => {
  if (down) return;
  const over = (targetP === 0 && p === 0 && pick(e, [stickerFront, stickerTop, glowRing])) ||
               (targetP === 1 && p === 1 && pick(e, [hero]));
  canvas.style.cursor = over ? 'pointer' : 'grab';
});

/* ───────────────────────── Loop / resize ───────────────────────── */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = Math.min(75, 38 * Math.max(1, 1.45 / camera.aspect));   // موبايل: وسّع الزاوية
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (p !== targetP) {
    const step = dt / DURATION;
    p = targetP > p ? Math.min(targetP, p + step) : Math.max(targetP, p - step);
  }
  flip += (flipTarget - flip) * Math.min(1, dt * 6);
  applyState(t);
  updateUI();
  controls.update();
  renderer.render(scene, camera);
});

// للتجربة: ?open=1 بيفتح العلبة أوتوماتيك, ?instant=1 بيفتحها فوراً
if (new URLSearchParams(location.search).get('instant') === '1') { p = 1; targetP = 1; }
else if (new URLSearchParams(location.search).get('open') === '1') setOpen(true);
window.__evo = { setOpen, camera, controls, get p() { return p; } };
</script>
</body>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EVO Plus 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,700&display=swap">
<style>
/* Layout: a full-bleed studio stage. The WebGL canvas fills it; brand header sits top-start,
   a status pill and one action sit bottom-centre; a pulsing ring marks the seal sticker. */
:root{
  --bg:#D3E5FF;
  --bg-hi:#F5F9FF;
  --fg:#2535A8;
  --muted:#575B65;
  --line:rgba(23,24,28,.14);
  --panel:rgba(255,255,255,.76);
  --red:#CF1F2A;
  --btn:#0055D0;
  --btn-ink:#FFFFFF;
  --ring:#0055D0;
  --font-ui:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#D3E5FF; --bg-hi:#F5F9FF; --fg:#2535A8; --muted:#A8ACB6;
    --line:rgba(255,255,255,.16); --panel:rgba(28,30,36,.76);
    --red:#FF5A63; --btn:#0055D0; --btn-ink:#FFFFFF; --ring:#0055D0;
    color-scheme:light;
  }
}
:root[data-theme="dark"]{
  --bg:#D3E5FF; --bg-hi:#F5F9FF; --fg:#2535A8; --muted:#A8ACB6;
  --line:rgba(255,255,255,.16); --panel:rgba(28,30,36,.76);
  --red:#FF5A63; --btn:#0055D0; --btn-ink:#FFFFFF; --ring:#0055D0;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}

.app{
  position:relative;height:100%;min-height:540px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse 78% 62% at 50% 56%,var(--bg-hi),var(--bg) 74%);
}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}

.brand{position:relative;z-index:2;pointer-events:none;min-width:0}
.brand h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,5vw,2.15rem);line-height:1;letter-spacing:.01em}
.brand h1 .plus{font-style:italic;font-weight:700;color:var(--red);margin-inline-start:.18em}
.brand p{margin:.45rem 0 0;font-size:.88rem;color:var(--muted)}

.bar{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.status{
  min-width:0;max-width:100%;padding:9px 16px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-size:.9rem;font-weight:600;text-align:center;
}
.btn{
  font:600 .9rem var(--font-ui);padding:10px 18px;border:0;border-radius:999px;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);
}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.ping:focus-visible .ring{outline:3px solid var(--fg);outline-offset:3px}

.ping{
  position:absolute;left:0;top:0;z-index:3;width:0;height:0;padding:0;border:0;background:none;
  pointer-events:none;opacity:0;transition:opacity .25s;
}
.ping.on{opacity:1}
.ping .ring{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;border:2px solid var(--ring);box-sizing:border-box}
.ping .ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--ring);animation:pulse 1.8s ease-out infinite}
.ping .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--ring)}
.ping .tag{
  position:absolute;top:34px;left:0;transform:translateX(-50%);white-space:nowrap;
  padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:700;
  background:var(--btn);color:var(--btn-ink);
}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.ping .ring::after{animation:none;opacity:.35}}

.loading{position:absolute;inset:0;z-index:4;display:grid;place-items:center;font-weight:600;color:var(--muted);background:transparent;text-align:center;padding:24px}
.loading[hidden]{display:none}
.loading img{display:block;max-width:min(240px,60%);margin:0 auto 14px;border-radius:6px}
</style>

<main class="app" id="app" dir="rtl" lang="ar">
  <canvas id="gl" aria-label="مجسم ثلاثي الأبعاد لكرتونة جهاز EVO Plus. اسحب للتدوير."></canvas>

  <header class="brand">
    <h1><bdi dir="ltr">EVO<span class="plus">Plus</span></bdi></h1>
    <p>جهاز قياس السكر · مجسم ثلاثي الأبعاد</p>
  </header>

  <button class="ping" id="ping" type="button" aria-label="افتح الكرتونة">
    <span class="ring"></span><span class="dot"></span>
    <span class="tag" id="pingTag">اضغط على الاستيكر</span>
  </button>

  <div class="bar">
    <div class="status" id="status" role="status" aria-live="polite">اسحب لتدوير الكرتونة</div>
    <button class="btn" id="again" type="button" hidden>قفّل الكرتونة</button>
  </div>

  <div class="loading" id="loading">جاري تجهيز المجسم…</div>
</main>

/* ---------- helpers for canvas textures ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function rr(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function srgb(t){t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;t.needsUpdate=true;return t;}
function imgTex(img){return srgb(new THREE.Texture(img));}
function cvTex(c){return srgb(new THREE.CanvasTexture(c));}
function newCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

const SERIF='"Playfair Display", Georgia, "Times New Roman", serif';
function drawLogo(ctx,cx,cy,targetW,col){
  const S=200;
  ctx.save();
  ctx.textBaseline='alphabetic';
  ctx.font='600 '+S+'px '+SERIF; const wE=ctx.measureText('EVO').width;
  ctx.font='italic 700 '+(S*1.32)+'px '+SERIF; const wP=ctx.measureText('P').width;
  ctx.font='italic 700 '+S+'px '+SERIF; const wL=ctx.measureText('lus').width;
  const gap=S*0.05, total=wE+gap+wP*0.9+wL, k=targetW/total;
  ctx.translate(cx-targetW/2,cy+S*0.35*k); ctx.scale(k,k);
  let x=0;
  ctx.fillStyle=col.evo; ctx.font='600 '+S+'px '+SERIF; ctx.fillText('EVO',x,0); x+=wE+gap;
  ctx.fillStyle=col.p; ctx.font='italic 700 '+(S*1.32)+'px '+SERIF; ctx.fillText('P',x,S*0.14); x+=wP*0.9;
  ctx.fillStyle=col.lus; ctx.font='italic 700 '+S+'px '+SERIF; ctx.fillText('lus',x,0);
  ctx.restore();
}

function makeLidTexture(){
  const w=1400,h=580,c=newCanvas(w,h),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#EA2830'); g.addColorStop(.55,'#D41C25'); g.addColorStop(1,'#B3121B');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  const rg=x.createRadialGradient(w*.3,h*.25,10,w*.3,h*.25,w*.6);
  rg.addColorStop(0,'rgba(255,255,255,.18)'); rg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=rg; x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,255,255,.075)';
  for(let yy=10,row=0;yy<h;yy+=15,row++){for(let xx=(row%2)*7.5+6;xx<w;xx+=15){x.beginPath();x.arc(xx,yy,1.7,0,6.283);x.fill();}}
  drawLogo(x,w/2,h/2,w*0.56,{evo:'#fff',p:'#1b1b20',lus:'#fff'});
  return cvTex(c);
}

function makeCaseLabel(){
  const capW=CW-2*BS, capH=CH-2*BS, w=720, h=Math.round(w*capH/capW);
  const c=newCanvas(w,h), x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,'#F7F6F4'); g.addColorStop(1,'#E9E7E3');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  const cw=w*0.285, ch=h*0.668, cx=w/2, cy=h/2;
  const pg=x.createLinearGradient(cx-cw/2,0,cx+cw/2,0); pg.addColorStop(0,'#EA262E'); pg.addColorStop(1,'#C5141C');
  x.fillStyle=pg; rr(x,cx-cw/2,cy-ch/2,cw,ch,cw/2); x.fill();
  x.save(); x.translate(cx,cy); x.rotate(Math.PI/2);
  drawLogo(x,0,-cw*0.17,ch*0.47,{evo:'#fff',p:'#1b1b20',lus:'#fff'});
  const label='Blood Glucose Monitoring System';
  x.font='600 100px '+SERIF; const m=x.measureText(label).width;
  x.font='600 '+(100*(ch*0.74)/m)+'px '+SERIF;
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(label,0,cw*0.2);
  x.restore();
  const t=cvTex(c);
  t.repeat.set(1/capW,1/capH); t.offset.set(0.5,0.5);
  return t;
}

function makeStickerTex(img){
  /* the sticker runs lengthwise (long side crosses the seam), so the photo is turned 90deg: the text reads bottom-to-top */
  const h=512,w=Math.round(512*img.height/img.width),c=newCanvas(w,h),x=c.getContext('2d');
  x.save(); rr(x,0,0,w,h,28); x.clip();
  try{x.filter='brightness(1.1) contrast(1.05) saturate(1.05)';}catch(e){}
  x.save(); x.translate(0,h); x.rotate(-Math.PI/2); x.drawImage(img,0,0,h,w); x.restore(); x.filter='none';
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'rgba(255,255,255,.30)'); g.addColorStop(.5,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(255,255,255,.14)');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  x.restore();
  x.lineWidth=3; x.strokeStyle='rgba(255,255,255,.6)'; rr(x,1.5,1.5,w-3,h-3,27); x.stroke();
  return cvTex(c);
}

function makeBlobTexture(){
  const c=newCanvas(256,256),x=c.getContext('2d');
  const g=x.createRadialGradient(128,128,8,128,128,128);
  g.addColorStop(0,'rgba(0,0,0,.85)'); g.addColorStop(.55,'rgba(0,0,0,.35)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

const lookAt=new THREE.Vector3();
function place(fo,time,dragging,fw){
  const ty=lerp(lerp(0.2,5.8,fo),0.6,fw), ox=1.8*fw, oz=8*fw;
  const needH=lerp(lerp(14.8,24.5,fo),25,fw), needW=lerp(10.8,20,fw);
  const tanH=Math.tan(FOV*Math.PI/360);
  const r=zoom*Math.max(needH/(2*tanH),needW/(2*tanH*aspect));
  const sway=(reduce||dragging)?0:Math.sin(time*0.55)*0.05*(1-fo);
  const th=yaw+sway, ph=pitch;
  camera.position.set(ox+r*Math.sin(th)*Math.cos(ph),ty+r*Math.sin(ph),oz+r*Math.cos(th)*Math.cos(ph));
  lookAt.set(ox,ty,oz); camera.lookAt(lookAt);
}

function resize(){
  const w=Math.max(1,app.clientWidth), h=Math.max(1,app.clientHeight);
  vw=w; vh=h; aspect=w/h;
  renderer.setSize(w,h,false);
  camera.aspect=aspect; camera.updateProjectionMatrix();
}
resize();
if(window.ResizeObserver) new ResizeObserver(resize).observe(app); else addEventListener('resize',resize);

/* ---------- state ---------- */
let openT=0, dir=0, target=TOTAL, curState='closed';
const TXT={closed:'اسحب لتدوير الكرتونة',opening:'بنفتح الكرتونة…',open:'اضغط على الجهاز أو القلم أو علبة الاستربس · اسحب وشوف من كل ناحية',closing:'بنقفّل الكرتونة…',ready:'العلبة جاهزة · اضغط عليها عشان تتفتح'};
function setState(s){
  curState=s;
  statusEl.textContent=TXT[s];
  againBtn.hidden=(s!=='open'&&s!=='ready');
}
function openBox(){ if(dir!==0||openT>0.001) return; dir=1; target=HOLD; pitchT=Math.max(pitchT,0.7); yawT=clamp(yawT,-0.7,0.7); setState('opening'); }
function closeBox(){ if(dir!==0||openT<0.001) return; resetStrip(); if(pdetached&&ps>0.001){pdir=-1;pendingClosePen=true;setState('closing');return;} if(detached&&ms>0.001){mdir=-1;pendingClose=true;setState('closing');return;} dir=-1; vialOpen=false; setState('closing'); }
function overVial(e){
  if(dir!==0||openT<TOTAL-0.001) return false;
  const rc=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(ndc,camera);
  return ray.intersectObject(vialObj,true).length>0;
}
function overMeter(e){
  if(dir!==0||openT<TOTAL-0.001) return false;
  const rc=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hm=ray.intersectObject(meterObj,true); if(!hm.length) return false;
  const hp=ray.intersectObject(penObj,true);
  return !(hp.length&&hp[0].distance<hm[0].distance);
}
function overPen(e){
  if(dir!==0||openT<TOTAL-0.001) return false;
  const rc=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hp=ray.intersectObject(penObj,true); if(!hp.length) return false;
  const hm=ray.intersectObject(meterObj,true);
  return !(hm.length&&hm[0].distance<hp[0].distance);
}
function openCase(){ if(dir!==0||Math.abs(openT-HOLD)>0.001) return; dir=1; target=TOTAL; setState('opening'); }
ping.addEventListener('click',()=>{ if(openT<0.001) openBox(); else openCase(); });
againBtn.addEventListener('click',closeBox);

/* ---------- pointer input ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), pts=new Map();
let down=null, pinch=0;
const pdist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
function overSticker(e){
  if(dir!==0||openT>0.001) return false;
  const rc=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([proxy].concat(solids),false);
  return !!(hits.length&&hits[0].object===proxy);
}
function overCase(e){
  if(dir!==0||Math.abs(openT-HOLD)>0.001) return false;
  const rc=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);
  ray.setFromCamera(ndc,camera);
  return ray.intersectObject(caseG,true).length>0;
}
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1) down={t:performance.now(),moved:0};
  {const q=(pts.size===1)?pickStrip(e):null; if(q) sdp={id:e.pointerId,x:e.clientX,y:e.clientY,q};}
  if(pts.size===2) pinch=pdist();
  canvas.style.cursor='grabbing';
});
canvas.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId);
  if(!p){canvas.style.cursor=(overStrip(e)||overEject(e)||overSticker(e)||overCase(e)||overVial(e)||overPen(e)||overMeter(e))?'pointer':'grab';return;}
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(down) down.moved+=Math.abs(dx)+Math.abs(dy);
  if(sdp&&sdp.id===e.pointerId){
    let ds=strips.find(q=>q.st.state==='drag');
    if(!ds&&Math.hypot(e.clientX-sdp.x,e.clientY-sdp.y)>6&&sdp.q&&canGrab(sdp.q)){ beginStripDrag(e,sdp.q); ds=sdp.q; }
    if(ds){ use(ds); dragMove(e); }
    return;
  }
  if(pts.size===1){yawT-=dx*0.009; pitchT=clamp(pitchT+dy*0.006,0.03,1.2);}
  else if(pts.size===2){const d=pdist(); if(pinch>0) zoom=clamp(zoom*pinch/d,0.55,1.8); pinch=d;}
});
function endPtr(e,cancel){
  const single=pts.size===1;
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=0;
  if(sdp&&sdp.id===e.pointerId){
    const ds=strips.find(q=>q.st.state==='drag'); const dragging=!!ds; sdp=null;
    if(dragging){ use(ds); releaseStrip(); if(pts.size===0){down=null;canvas.style.cursor='grab';} return; }
  }
  if(!cancel&&single&&down&&down.moved<8&&performance.now()-down.t<700&&overSticker(e)) openBox();
  else if(!cancel&&single&&down&&down.moved<8&&performance.now()-down.t<700&&overCase(e)) openCase();
  else if(!cancel&&single&&down&&down.moved<8&&performance.now()-down.t<700&&overVial(e)) vialOpen=!vialOpen;
  else if(!cancel&&single&&down&&down.moved<8&&performance.now()-down.t<700&&overEject(e)) pressEject();
  else if(!cancel&&single&&down&&down.moved<8&&performance.now()-down.t<700&&overPen(e)) togglePen();
  else if(!cancel&&single&&down&&down.moved<8&&performance.now()-down.t<700&&overMeter(e)&&!hitInserted(e)) toggleMeter();
  if(pts.size===0){down=null;canvas.style.cursor='grab';}
}
canvas.addEventListener('pointerup',e=>endPtr(e,false));
canvas.addEventListener('pointercancel',e=>endPtr(e,true));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(e.deltaY*0.001),0.55,1.8);},{passive:false});

/* ---------- ping marker ---------- */
const v3=new THREE.Vector3(), anchor=new THREE.Object3D(); anchor.position.copy(C); carton.add(anchor);
function updatePing(){
  const st=(dir===0&&openT<0.001)?1:(dir===0&&Math.abs(openT-HOLD)<0.001)?2:0;
  if(!st){ping.classList.remove('on');return;}
  (st===1?anchor:caseG).getWorldPosition(v3);
  pingTag.textContent=st===1?'اضغط على الاستيكر':'اضغط على العلبة';
  ping.setAttribute('aria-label',st===1?'افتح الكرتونة':'افتح العلبة');
  const toCam=camera.position.clone().sub(v3).normalize();
  const facing=st===1?toCam.y*0.7071+toCam.z*0.7071:toCam.y;     // sticker faces up-front
  v3.project(camera);
  const sx=(v3.x*0.5+0.5)*vw, sy=(-v3.y*0.5+0.5)*vh;
  ping.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px)';
  const tw=pingTag.offsetWidth||140;
  const off=clamp(0,tw/2+10-sx,vw-tw/2-10-sx);
  pingTag.style.left=off.toFixed(1)+'px';
  ping.classList.toggle('on',facing>0.2);
}

/* ---------- loop ---------- */
let last=performance.now(), time=0, first=true;
applyTimeline(0,0);
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return;}
  const dt=Math.min(0.05,(now-last)/1000); last=now; time+=dt;
  if(dir!==0){
    openT+=dir*(dir>0?1.4:2.4)*(reduce?1.4:1)*dt;
    if(dir>0&&openT>=target){openT=target;dir=0;setState(target>=TOTAL?'open':'ready');}
    else if(dir<0&&openT<=0){openT=0;dir=0;setState('closed');}
  }
  const k=Math.min(1,dt*10);
  yaw+=(yawT-yaw)*k; pitch+=(pitchT-pitch)*k;
  applyTimeline(openT,time);
  updateVial(dt,time);
  updateMeter(dt,time);
  updatePen(dt,time);
  updateStrip(dt,time);
  if(curState==='open'){ const h=hintText(); if(statusEl.textContent!==h) statusEl.textContent=h; }
  const fo=easeInOutCubic(seg(openT,1.4,CASE_END)), fw=easeInOutCubic(seg(openT,CASE_END,5.0));
  surfMat.opacity=surfBase*seg(openT,CASE_END,4.4);
  place(fo,time,pts.size>0,fw);
  updatePing();
  renderer.render(scene,camera);
  if(first){first=false;loadingEl.hidden=true;}
}
requestAnimationFrame(frame);

}catch(err){
  console.error(err);
  const l=document.getElementById('loading');
  if(l){l.hidden=false;l.textContent='حصل خطأ أثناء تجهيز المجسم. جرّب تحدّث الصفحة.';}
}
})();
</script>

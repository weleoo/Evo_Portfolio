name: evo_portfolio
description: "EVO MED - Medical Equipment & In-Vitro Diagnostics Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  model_viewer_plus: ^1.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/2.0x/
    - assets/models/
    - assets/3d/
    - assets/3d/textures/hpylori_ag/
    - assets/3d/textures/evo_plus/
    - assets/3d/textures/ctni/
